spring.application.name=madrid-help

# Development profile: loads fictional test data (see DevDataLoader).
# In production this must NOT be "dev".
spring.profiles.active=dev

# In-memory database for development (wiped every time the app stops).
# We will switch to PostgreSQL or MySQL later.
spring.datasource.url=jdbc:h2:mem:madridhelp
spring.datasource.username=sa
spring.datasource.password=

# Hibernate creates the tables from the @Entity classes and drops them on shutdown.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# H2 web console to inspect the tables: http://localhost:8080/h2-console
spring.h2.console.enabled=true
